services:
  postgres:
    image: postgres:16-alpine
    container_name: altura-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: altura
      POSTGRES_PASSWORD: altura
      POSTGRES_DB: altura
    ports:
      - "5432:5432"
    volumes:
      - altura-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U altura -d altura"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  altura-postgres-data:
